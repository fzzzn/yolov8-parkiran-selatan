services:
  yolov8-parkiran-selatan:
    image: yolov8-parkiran-selatan
    container_name: yolov8-parkiran-selatan
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - YOLO_CONFIG_DIR=/tmp/Ultralytics
      - NNPACK_DISABLE=1
    volumes:
      # Mount config.json if you need to update parking areas without rebuilding
      - ./config.json:/app/config.json:ro
      # Optional: Mount model cache to avoid re-downloading
      - yolov8-models:/root/.cache/ultralytics

volumes:
  yolov8-models:
